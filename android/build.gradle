import javax.net.ssl.*

// --- الجزء الخاص بتجاوز أخطاء الشهادات (SSL Bypass) ---
// هذا الجزء يضمن أن أي اتصال يتم داخل Java يتجاهل فحص الشهادات المعطوبة
TrustManager[] trustAllCerts = [
    new X509TrustManager() {
        public java.security.cert.X509Certificate[] getAcceptedIssuers() { return null }
        public void checkClientTrusted(java.security.cert.X509Certificate[] certs, String authType) {}
        public void checkServerTrusted(java.security.cert.X509Certificate[] certs, String authType) {}
    }
] as TrustManager[]

try {
    SSLContext sc = SSLContext.getInstance("SSL")
    sc.init(null, trustAllCerts, new java.security.SecureRandom())
    HttpsURLConnection.setDefaultSSLSocketFactory(sc.getSocketFactory())
    HttpsURLConnection.setDefaultHostnameVerifier({ hostname, session -> true } as HostnameVerifier)
} catch (Exception e) {
    e.printStackTrace()
}
// ------------------------------------------------

buildscript {
    ext.kotlin_version = '1.8.22'
    repositories {
        // إضافة روابط HTTP صريحة لتخطي حجب شهادات SSL في مصر
        maven { url "http://dl.google.com/dl/android/maven2/"; allowInsecureProtocol = true }
        maven { url "http://repo.maven.apache.org/maven2/"; allowInsecureProtocol = true }
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        // نكرر نفس الروابط هنا لضمان وصول المكتبات الفرعية (Plugins)
        maven { url "http://dl.google.com/dl/android/maven2/"; allowInsecureProtocol = true }
        maven { url "http://repo.maven.apache.org/maven2/"; allowInsecureProtocol = true }
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}